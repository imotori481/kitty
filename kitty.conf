# ===== テーマ =====
include ./theme.conf

# ===== フォント =====
font_family Firple
font_size 11.5
modify_font cell_height 110%

# ===== 文字 =====
# 普通の文字 / 背景
foreground #d9d7ce
background #212733
# マウスで選択した範囲の文字 / 背景
selection_foreground #212733
selection_background #343f4c
# zsh のコメント / zsh の入力補完候補
color0  #191e2a
color8  #686868
# エラー、git diff の削除行、ls の圧縮ファイル
color1  #ed8274
color9  #f28779
# 成功、git diff の追加行、ls の実行ファイル
color2  #a6cc70
color10 #bae67e
# 警告、git log のコミットハッシュ
color3  #fad07b
color11 #ffd580
# ls のディレクトリ
color4  #6dcbfa
color12 #73d0ff
# ls の画像ファイル
color5  #cfbafa
color13 #d4bfff
# ls のシンボリックリンク、git diff の @@ 行
color6  #90e1c6
color14 #95e6cb
# アプリが白を指定した文字 / その太字
color7  #c7c7c7
color15 #ffffff

# ===== カーソル =====
cursor #40E0D0
cursor_trail 1
cursor_blink_interval 0
cursor_trail_start_threshold 0
cursor_trail_decay 0.1 0.4
cursor_trail_color #40E0D0

# ===== ウィンドウサイズ =====
remember_window_size yes
initial_window_width  640
initial_window_height 400

# ===== 背景 =====
background_blur 25
background_opacity 0.75

# ===== ペインの余白と枠 =====
window_padding_width 6 10
window_border_width 1px
active_border_color #00FFFF
inactive_border_color #A0A0A0

# ===== レイアウトとタブバー =====
enabled_layouts splits,stack
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted

# ===== キーマップ: ペイン分割 =====
map ctrl+shift+\ launch --location=vsplit --cwd=current
map ctrl+shift+- launch --location=hsplit --cwd=current

# ===== キーマップ: ペイン移動 =====
map ctrl+shift+h neighboring_window left
map ctrl+shift+l neighboring_window right
map ctrl+shift+k neighboring_window up
map ctrl+shift+j neighboring_window down

# ===== キーマップ: 最大化と閉じる =====
map ctrl+shift+z toggle_layout stack
map ctrl+shift+w close_window
map ctrl+shift+q close_tab

# ===== キーマップ: プリセットレイアウト =====
# 今のペインをVSCode風に分割
map ctrl+shift+1 combine : launch --location=vsplit --bias=25 --keep-focus --cwd=current zsh -ic 'claude; exec zsh'
map ctrl+shift+2 combine : launch --location=vsplit --bias=25 --keep-focus --cwd=current zsh -ic 'claude; exec zsh' : launch --location=hsplit --bias=25 --keep-focus --cwd=current
